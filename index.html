<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="shortcut icon" href="favicon.png">
    <link href="https://fonts.googleapis.com/css2?family=Changa:wght@200..600&display=block" rel="stylesheet">
    <title>Typ het woord!</title>
    <link rel="stylesheet" href="css/index.css?v=14">
    <link rel="stylesheet" href="css/current-word.css?v=14">
    <link rel="stylesheet" href="css/brainrots.css?v=14">
</head>
<body style="--randomHue1: 0; --randomHue2: 0;">

<div class="high-score-container hidden js-high-score-container">
    <h1>Hoogste score</h1>
    <div class="high-score js-high-score"></div>
</div>

<div class="count-down-container hidden js-count-down-container">
    <h1>Tijd</h1>
    <div class="count-down js-count-down">0</div>
</div>

<div class="score-container js-score-container hidden">
    <h1>Jouw score</h1>
    <div class="score js-score"><span>0</span></div>
    <div class="brainrots js-brainrots"></div>
</div>

<div class="current-word-container js-current-word-container">
    <img class="hidden current-word-image js-current-word-image" src="" alt="">

    <div class="current-word js-current-word" data-current-word="Klaar?"></div>
    <input class="hidden" type="text" autofocus placeholder="Typ het woord">

    <button class="js-start-button" type="button" autofocus>Go!</button>
    <button class="hidden js-retry-button" type="button">Opnieuw!</button>
</div>

<div class="mode-container js-mode-container">
    <div class="option">
        <input type="radio" id="standard" name="mode" value="standard"/>
        <label for="standard">Standaard</label>
    </div>

    <div class="option">
        <input type="radio" id="brainrot" name="mode" value="brainrot"/>
        <label for="brainrot">Stoere kids</label>
    </div>

    <div class="option">
        <input type="radio" id="youngKids" name="mode" value="youngKids"/>
        <label for="youngKids">Jonge kids</label>
    </div>
</div>

<template id="brainrot-card-template">
    <div class="brainrot-card">
        <img src="" alt="" title="">
    </div>
</template>

<script src="js/index.js?v=14" type="module"></script>
</body>
</html>
