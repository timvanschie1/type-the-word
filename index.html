<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="shortcut icon" href="favicon.png">
    <link href="https://fonts.googleapis.com/css2?family=Changa:wght@200..600&display=block" rel="stylesheet">
    <title>Typ het woord!</title>
    <link rel="stylesheet" href="index.css">
</head>
<body style="--randomHue1: 0; --randomHue2: 0;">

<div class="high-score-container hidden js-high-score-container">
    <h1>Hoogste score <span class="js-high-score-date"></span></h1>
    <div class="high-score js-high-score"></div>
</div>

<div class="count-down-container js-count-down-container">
    <h1>Tijd</h1>
    <div class="count-down js-count-down">60</div>
</div>

<div class="score-container">
    <h1>Jouw score</h1>
    <div class="score js-score" data-score="0"><span>0</span></div>
</div>

<div class="current-word-container js-current-word-container">
    <div class="current-word js-current-word" data-current-word="">&nbsp;</div>
    <input type="text" autofocus placeholder="Typ het woord">
    <button class="hidden" onclick="location.reload()" type="button">Opnieuw!</button>
</div>

<script src="index.js"></script>
</body>
</html>
